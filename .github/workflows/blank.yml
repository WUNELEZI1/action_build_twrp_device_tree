name: Generate TWRP Device Tree

on:
  workflow_dispatch:
    inputs:
      LIBRARY_NAME:
        description: 'Library name for the device tree'
        required: true
        default: 'Twrp_Device_Generator'
      IMG_URL:
        description: 'URL to recovery/boot image'
        required: true
        default: 'https://raw.githubusercontent.com/WUNELEZI1/action_build_twrp_device_tree/refs/heads/main/boot.img'

jobs:
  generate-device-tree:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 \
          python3-pip \
          python3-venv \
          cpio \
          wget \
          zip \
          unzip \
          abootimg \
          file
        
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
        sudo update-alternatives --set python3 /usr/bin/python3.10
        
    - name: Install TWRP generator
      run: |
        python3 -m pip install --upgrade pip
        pip3 install twrpdtgen==2.4.0
        pip3 install sebaubuntu_libs==1.0.0
        
    - name: Fix device_info.py
      run: |
        DEVICE_INFO_PATH=$(python3 -c "import sebaubuntu_libs.libandroid.device_info; print(sebaubuntu_libs.libandroid.device_info.__file__)")
        cp $DEVICE_INFO_PATH ${DEVICE_INFO_PATH}.bak
        sed -i '/DEVICE_CODENAME = \[/c\DEVICE_CODENAME = [\n    "ro.product.bootimage.device",\n    "ro.product.device",\n    "ro.build.product",\n    "ro.product.name",\n    "ro.device.model"\]' $DEVICE_INFO_PATH
        cat $DEVICE_INFO_PATH | grep -A 10 "DEVICE_CODENAME"
        
    - name: Download recovery/boot image
      run: |
        wget -O recovery.img "${{ github.event.inputs.IMG_URL }}"
        file recovery.img
        abootimg -i recovery.img || true
        
    - name: Preprocess image
      run: |
        if ! abootimg -i recovery.img >/dev/null 2>&1; then
          dd if=recovery.img of=boot_fixed.img skip=1 bs=512
          mv boot_fixed.img recovery.img
        fi
        
    - name: Generate device tree
      run: |
        mkdir -p device_tree_output
        python3 -m twrpdtgen \
          -o device_tree_output \
          -c tb8786p1_64_k510_wifi \
          recovery.img
        
    - name: Compress device tree
      run: |
        cd device_tree_output
        zip -r ../DeviceTree_${{ github.run_number }}.zip .
        cd ..
        
    - name: Create release with device tree
      uses: softprops/action-gh-release@v1
      with:
        files: DeviceTree_${{ github.run_number }}.zip
        name: TWRP_Device_Tree_${{ github.run_number }}
        tag_name: dt-${{ github.run_number }}
        body: |
          Automatically generated TWRP device tree
          Build run: ${{ github.run_number }}
          Source image: ${{ github.event.inputs.IMG_URL }}
          Device codename: tb8786p1_64_k510_wifi
          Image format: $(file recovery.img | cut -d ',' -f1)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
